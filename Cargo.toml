[package]
name = "poppy-sql"
version = "0.9.1"
authors = ["Charlie Eeles <charlie@starflower.sh>"]
edition = "2024"
license = "Apache-2.0"
description = "Parser and formatter for standalone and embedded SQL"
repository = "https://github.com/Charlie-Eeles/poppy-sql"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlparser = "0.62.0"
toml = "1.1.2"
walkdir = "2.5.0"
anstream = { version = "1.0.0", optional = true }
anstyle = { version = "1.0.13", optional = true }
okhsl = { version = "1.0.1", optional = true }
unicode_categories = "0.1.1"
winnow = { version = "0.7.0", features = ["simd"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.52.3", features = ["full"] }
colored = "3.1.1"
dotenv = "0.15.0"
pg_query = "6.1.1"
notify = "8.2.0"
